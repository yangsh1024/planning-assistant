server:
  port: 8080

spring:
  application:
    name: planning-assistant
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/planning_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET}

wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
