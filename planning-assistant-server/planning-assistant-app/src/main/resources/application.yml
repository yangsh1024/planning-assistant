server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: planning-assistant
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/planning_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET}

wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:https://localhost:8080}
  fixed-qr-url: ${APP_FIXED_QR_URL:}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

agent:
  timeout-seconds: ${AGENT_TIMEOUT_SECONDS:60}
  max-output-tokens: ${AGENT_MAX_OUTPUT_TOKENS:4096}
  per-user-minute-limit: ${AGENT_PER_USER_MINUTE_LIMIT:10}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
